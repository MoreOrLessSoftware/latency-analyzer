plugins {
    id 'com.android.application'
}

// The release key stays out of the repo. Without this file a release build comes out unsigned.
def releaseSigning = new Properties()
def releaseSigningFile = new File(System.getProperty('user.home'), '.latency-cam/signing.properties')
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace 'ca.mlsoft.latencycam'
    compileSdk 37

    defaultConfig {
        applicationId 'ca.mlsoft.latencycam'
        minSdk 31
        targetSdk 36
        versionCode 2
        versionName '0.2'
    }

    signingConfigs {
        release {
            if (releaseSigning.storeFile) {
                storeFile new File(releaseSigningFile.parentFile, releaseSigning.storeFile)
                storePassword releaseSigning.password
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.password
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigning.storeFile) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}
